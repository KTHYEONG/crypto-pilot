name: Oracle CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  IMAGE: ghcr.io/kthyeong/crypto-pilot-live
  # 2026-09-22: frozen 전략+메이커 집행+or-vps 자동화 정비 완료, PAPER 모드로 재개.
  LIVE_DEPLOY_PAUSED: 'false'

jobs:
  # 잡 레벨 if: 는 워크플로 env 컨텍스트를 읽지 못한다(GitHub Actions 제약:
  # "Unrecognized named-value: 'env'"). 셸 스텝에서 값을 읽어 job output으로 넘긴다.
  gate:
    runs-on: ubuntu-latest
    outputs:
      paused: ${{ steps.check.outputs.paused }}
    steps:
      - id: check
        run: echo "paused=$LIVE_DEPLOY_PAUSED" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: gate
    if: ${{ needs.gate.outputs.paused != 'true' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Oracle Ampere 인스턴스는 arm64. 러너(amd64)에서 크로스 빌드한다.
      - name: Build and Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [gate, build-and-push]
    if: ${{ needs.gate.outputs.paused != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GitHub 러너(Azure 대역)는 Oracle Cloud 인바운드가 드롭되므로 Tailscale 사설망으로 접속한다.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy over Tailscale
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USERNAME }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"
          PARAMS="deploy/mhs"
          waited=0
          while true; do
            ssh $SSH_OPTS "$REMOTE_USER@$HOST" "cat ~/crypto-pilot/data/state/live_daemon_heartbeat.json 2>/dev/null || true" > heartbeat.json
            set +e
            python3 -m src.application.ops.daemon_idle_gate --heartbeat-file heartbeat.json --waited-s "$waited"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then break; fi
            if [ "$rc" -ne 10 ]; then exit "$rc"; fi
            sleep 60
            waited=$((waited + 60))
          done

          ssh $SSH_OPTS "$REMOTE_USER@$HOST" "mkdir -p ~/crypto-pilot/$PARAMS"

          scp $SSH_OPTS docker-compose.yml "$REMOTE_USER@$HOST:~/crypto-pilot/"
          # .env는 서버에 이미 배치된 것을 정본으로 쓴다(sops 폐기, CI가 더 이상 덮어쓰지 않음).
          # 봉인된 부트스트랩 아티팩트(deploy/mhs/*.enc)는 공개 리포에 추적하지 않으므로 CI가 배포하지 않는다.
          # 서버의 ~/crypto-pilot/deploy/mhs/ 사본을 정본으로 쓴다(.env와 동일한 취급).
          scp $SSH_OPTS "$PARAMS/venue_rules_20260921.json" \
            "$REMOTE_USER@$HOST:~/crypto-pilot/$PARAMS/"
          # repo-owned 백업 유닛이 소비하는 필터. 공용 타이머가 아닌 crypto-pilot-backup.service가
          # --filter-from으로 참조하므로, 이 scp는 그 경로의 파일 내용만 최신으로 유지한다.
          scp $SSH_OPTS deploy/crypto-pilot.rclone-filter "$REMOTE_USER@$HOST:~/crypto-pilot/deploy/crypto-pilot.rclone-filter.new"
          scp $SSH_OPTS deploy/compose_recreate.sh "$REMOTE_USER@$HOST:~/crypto-pilot/deploy/"
          ssh $SSH_OPTS "$REMOTE_USER@$HOST" "mkdir -p ~/crypto-pilot/deploy/backup ~/.config/systemd/user"
          scp $SSH_OPTS deploy/backup/crypto-pilot-backup.sh "$REMOTE_USER@$HOST:~/crypto-pilot/deploy/backup/crypto-pilot-backup.sh.new"
          scp $SSH_OPTS deploy/backup/crypto-pilot-backup.service deploy/backup/crypto-pilot-backup.timer "$REMOTE_USER@$HOST:~/.config/systemd/user/"
          # 데몬 생존 감시(호스트 타이머): 죽은 데몬은 스스로 알릴 수 없으므로 데몬과 별개 프로세스로 감시한다.
          ssh $SSH_OPTS "$REMOTE_USER@$HOST" "mkdir -p ~/crypto-pilot/deploy/liveness"
          scp $SSH_OPTS deploy/liveness/crypto-pilot-liveness.sh "$REMOTE_USER@$HOST:~/crypto-pilot/deploy/liveness/crypto-pilot-liveness.sh.new"
          scp $SSH_OPTS deploy/liveness/crypto-pilot-liveness.service deploy/liveness/crypto-pilot-liveness.timer "$REMOTE_USER@$HOST:~/.config/systemd/user/"

          # PAT/USER는 로컬에서 확장해 원격 스크립트에 주입(GitHub PAT 문자셋은 셸 안전).
          ssh $SSH_OPTS "$REMOTE_USER@$HOST" bash -s <<EOF
          set -e
          cd ~/crypto-pilot
          mv -f ~/crypto-pilot/deploy/crypto-pilot.rclone-filter.new ~/crypto-pilot/deploy/crypto-pilot.rclone-filter
          mv -f ~/crypto-pilot/deploy/backup/crypto-pilot-backup.sh.new ~/crypto-pilot/deploy/backup/crypto-pilot-backup.sh
          chmod +x ~/crypto-pilot/deploy/backup/crypto-pilot-backup.sh
          mv -f ~/crypto-pilot/deploy/liveness/crypto-pilot-liveness.sh.new ~/crypto-pilot/deploy/liveness/crypto-pilot-liveness.sh
          chmod +x ~/crypto-pilot/deploy/liveness/crypto-pilot-liveness.sh
          systemctl --user daemon-reload
          systemctl --user enable --now crypto-pilot-backup.timer
          systemctl --user enable --now crypto-pilot-liveness.timer
          echo '$GHCR_PAT' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
          if docker compose version >/dev/null 2>&1; then C="docker compose"; else C="docker-compose"; fi
          bash ~/crypto-pilot/deploy/compose_recreate.sh '$IMAGE:latest'
          EOF
