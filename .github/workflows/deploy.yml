name: Oracle CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  IMAGE: ghcr.io/kthyeong/crypto-pilot-live

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        run: |
          docker build -t "$IMAGE:latest" .
          docker push "$IMAGE:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "~/crypto-pilot/"

      - name: Decrypt .env
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          curl -sL https://github.com/getsops/sops/releases/latest/download/sops-linux-amd64 -o /usr/local/bin/sops
          chmod +x /usr/local/bin/sops
          sops -d .env.enc > .env.decrypted

      - name: Copy .env via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".env.decrypted"
          target: "~/crypto-pilot/"

      - name: Copy strategy params via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docs/results/mhs_horizon_diagnostic_artifacts/strategy_params.json.enc,docs/results/mhs_horizon_diagnostic_artifacts/strategy_bootstrap.parquet.enc"
          target: "~/crypto-pilot/docs/results/mhs_horizon_diagnostic_artifacts/"
        if: hashFiles('docs/results/mhs_horizon_diagnostic_artifacts/strategy_params.json.enc') != ''

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_PAT
          script: |
            cd ~/crypto-pilot

            # 복호화된 .env를 compose 실행 전에 배치(이미지 밖, env_file 주입 전용)
            if [ -f .env.decrypted ]; then
              mv .env.decrypted .env
            fi

            # GHCR 로그인(private 패키지 pull용 read:packages PAT)
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Docker Compose V1/V2 양쪽 호환
            if docker compose version > /dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi

            # --force-recreate: 이미지 변경 시 컨테이너 강제 재생성
            # --remove-orphans: compose에서 제거된 서비스 컨테이너 정리
            $COMPOSE_CMD pull
            $COMPOSE_CMD up -d --force-recreate --remove-orphans
            docker image prune -f
