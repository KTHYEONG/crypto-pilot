name: Oracle CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  IMAGE: ghcr.io/kthyeong/crypto-pilot-live

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Oracle Ampere 인스턴스는 arm64. 러너(amd64)에서 크로스 빌드한다.
      - name: Build and Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Tailscale OAuth Credentials
        run: |
          set -u
          echo "=== 1. OAuth 토큰 발급 테스트 ==="
          TOKEN_RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -u "${{ secrets.TS_OAUTH_CLIENT_ID }}:${{ secrets.TS_OAUTH_SECRET }}" \
            https://api.tailscale.com/api/v2/oauth/token \
            -d grant_type=client_credentials)
          
          HTTP_CODE=$(echo "$TOKEN_RESP" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$TOKEN_RESP" | sed '/HTTP_STATUS/d')
          echo "OAuth Token HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ OAuth 토큰 발급 실패! 원본 응답:"
            echo "$BODY"
            exit 1
          fi
          
          echo "✅ OAuth 토큰 발급 성공!"
          echo "부여된 Scopes 메타데이터:"
          echo "$BODY" | jq 'del(.access_token)'
          ACCESS_TOKEN=$(echo "$BODY" | jq -r .access_token)
          
          echo "=== 1-1. 키 목록 조회(Read) 테스트 ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            https://api.tailscale.com/api/v2/tailnet/-/keys
          
          echo "=== 2. tag:ci ephemeral auth key 생성 권한 테스트 ==="
          KEY_RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:ci"]}}}}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys)
          
          KEY_HTTP_CODE=$(echo "$KEY_RESP" | grep "HTTP_STATUS" | cut -d':' -f2)
          KEY_BODY=$(echo "$KEY_RESP" | sed '/HTTP_STATUS/d')
          echo "Key Creation HTTP Status: $KEY_HTTP_CODE"
          echo "원본 응답:"
          echo "$KEY_BODY"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Diagnose Tailscale Connectivity
        env:
          HOST: ${{ secrets.HOST }}
        run: |
          echo "=== 1. Tailscale 상태 및 머신 목록 확인 ==="
          tailscale status
          echo "=== 2. Oracle 서버 Ping 테스트 ==="
          tailscale ping -c 3 "$HOST" || true
          echo "=== 3. 22번 포트 도달 확인 ==="
          nc -zv -w 5 "$HOST" 22 || true

      - name: Decrypt .env
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          SOPS_VERSION=v3.9.3
          curl -fsSL "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64" -o /tmp/sops
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version
          sops -d --input-type dotenv --output-type dotenv .env.enc > .env.decrypted

      - name: Deploy over Tailscale
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USERNAME }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"
          PARAMS="docs/results/mhs_horizon_diagnostic_artifacts"

          ssh $SSH_OPTS "$REMOTE_USER@$HOST" "mkdir -p ~/crypto-pilot/$PARAMS"

          scp $SSH_OPTS docker-compose.yml "$REMOTE_USER@$HOST:~/crypto-pilot/"
          scp $SSH_OPTS .env.decrypted "$REMOTE_USER@$HOST:~/crypto-pilot/.env"
          if [ -f "$PARAMS/strategy_params.json.enc" ]; then
            scp $SSH_OPTS "$PARAMS/strategy_params.json.enc" "$PARAMS/strategy_bootstrap.parquet.enc" \
              "$REMOTE_USER@$HOST:~/crypto-pilot/$PARAMS/"
          fi

          # PAT/USER는 로컬에서 확장해 원격 스크립트에 주입(GitHub PAT 문자셋은 셸 안전).
          ssh $SSH_OPTS "$REMOTE_USER@$HOST" bash -s <<EOF
          set -e
          cd ~/crypto-pilot
          echo '$GHCR_PAT' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
          if docker compose version >/dev/null 2>&1; then C="docker compose"; else C="docker-compose"; fi
          \$C pull
          \$C up -d --force-recreate --remove-orphans
          docker image prune -f
          EOF
