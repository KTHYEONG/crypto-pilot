services:
  mhs-live:
    image: ghcr.io/kthyeong/crypto-pilot-live:latest
    container_name: mhs-live-daemon
    restart: unless-stopped
    stop_grace_period: 120s
    env_file: /home/ubuntu/quant-secrets/crypto-pilot.env
    environment:
      - LIVE_MODE=paper
    volumes:
      - ./data:/app/data
      - ./data/state:/app/data/state
      - ./logs:/app/logs
      - ./deploy/mhs:/app/deploy/mhs
    mem_limit: 3g
    command: ["uv", "run", "python", "-m", "src.cli.main", "live", "daemon"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  liquidation-collector:
    image: ghcr.io/kthyeong/crypto-pilot-live:latest
    container_name: liquidation-collector
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 768m
    env_file: /home/ubuntu/quant-secrets/crypto-pilot.env
    volumes:
      - ./data/futures/liquidations:/app/data/futures/liquidations
      - ./data/state:/app/data/state
    command: ["uv", "run", "python", "-m", "src.cli.main", "data", "collect", "stream-liquidations"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
