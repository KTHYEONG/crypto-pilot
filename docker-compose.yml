services:
  mhs-live:
    image: ghcr.io/kthyeong/crypto-pilot-live:latest
    container_name: mhs-live-daemon
    restart: unless-stopped
    stop_grace_period: 120s
    env_file: /home/ubuntu/quant-secrets/crypto-pilot.env
    environment:
      - LIVE_MODE=paper
      - LIVE_EXECUTION_POLICY=strict_passive
      - LIVE_PAPER_FILL_MODEL=peg_chase
      - LIVE_NOTIONAL_EQUITY_USDT=2100
      - LIVE_RECORD_RUN_ID=frozen_top20_v2_bayes_maker_20260921
      - LIVE_TAX_COLLECTION_ENABLED=false
      - LIVE_ORDERBOOK_CAPTURE_BASELINE_MAX_SYMBOLS=0
      - LIVE_ORDERBOOK_CAPTURE_MAX_SYMBOLS=20
    volumes:
      - ./data:/app/data
      - ./data/state:/app/data/state
      - ./logs:/app/logs
      - ./deploy/mhs:/app/deploy/mhs
    mem_limit: 2g
    command: ["uv", "run", "python", "-m", "src.cli.main", "live", "daemon"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  liquidation-collector:
    image: ghcr.io/kthyeong/crypto-pilot-live:latest
    container_name: liquidation-collector
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 768m
    env_file: /home/ubuntu/quant-secrets/crypto-pilot.env
    volumes:
      - ./data/futures/liquidations:/app/data/futures/liquidations
      - ./data/state:/app/data/state
    command: ["uv", "run", "python", "-m", "src.cli.main", "data", "collect", "stream-liquidations"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
