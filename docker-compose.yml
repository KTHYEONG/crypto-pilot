version: '3.8'

services:
  # Upbit Spot Trading Bot
  spot-bot:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/my-coin-bot:latest
    container_name: coin-trader-spot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./results:/app/results
    command: >
      /bin/sh -c "cp /app/results_seed/* /app/results/ 2>/dev/null || true &&
      python -u src/execution/trader_spot.py"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Binance Futures Trading Bot
  futures-bot:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/my-coin-bot:latest
    container_name: coin-trader-futures
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./results:/app/results
    command: >
      /bin/sh -c "cp /app/results_seed/* /app/results/ 2>/dev/null || true &&
      python -u src/execution/trader_futures.py"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5" 