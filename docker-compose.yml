version: '3.8'

services:
  # 현물 트레이딩 봇 (Upbit)
  spot-bot:
    build: .
    container_name: coin-trader-spot
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./results:/app/results
      # Spot도 JSON 방식을 사용한다면 아래 DB 매핑은 추후 제거 가능
      - ./spot_strategy.db:/app/spot_strategy.db
    command: python -u src/spot_strategy/real_trader_spot.py
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 선물 트레이딩 봇 (Binance)
  futures-bot:
    build: .
    container_name: coin-trader-futures
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./results:/app/results
    command: python -u src/futures_strategy/real_trader_futures.py
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
