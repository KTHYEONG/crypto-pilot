services:
  mhs-live:
    image: ghcr.io/kthyeong/crypto-pilot-live:latest
    container_name: mhs-live-daemon
    restart: unless-stopped
    stop_grace_period: 120s
    env_file: /home/ubuntu/quant-secrets/crypto-pilot.env
    environment:
      - LIVE_MODE=paper
      - LIVE_EXECUTION_POLICY=strict_passive
      - LIVE_PAPER_FILL_MODEL=peg_chase
      - LIVE_NOTIONAL_EQUITY_USDT=2100
      - LIVE_RECORD_RUN_ID=frozen_top20_v2_bayes_maker_20260922
      - LIVE_TAX_COLLECTION_ENABLED=false
    volumes:
      - ./data:/app/data
      - ./data/state:/app/data/state
      - ./logs:/app/logs
      - ./deploy/mhs:/app/deploy/mhs
    mem_limit: 2g
    command: ["uv", "run", "python", "-m", "src.cli.main", "live", "daemon"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  capture-blue:
    image: ghcr.io/kthyeong/crypto-pilot-live:latest
    container_name: market-capture-blue
    profiles: ["capture-blue"]
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 256m
    env_file:
      - path: /home/ubuntu/quant-secrets/crypto-pilot-recorder.env
        required: false
    volumes:
      - ./data/live_capture:/app/data/live_capture
      - ./logs:/app/logs
    command: ["/app/.venv/bin/python", "-m", "src.capture.main", "--slot", "blue"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  capture-green:
    image: ghcr.io/kthyeong/crypto-pilot-live:latest
    container_name: market-capture-green
    profiles: ["capture-green"]
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 256m
    env_file:
      - path: /home/ubuntu/quant-secrets/crypto-pilot-recorder.env
        required: false
    volumes:
      - ./data/live_capture:/app/data/live_capture
      - ./logs:/app/logs
    command: ["/app/.venv/bin/python", "-m", "src.capture.main", "--slot", "green"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  market-normalizer:
    image: ghcr.io/kthyeong/crypto-pilot-live:latest
    container_name: market-normalizer
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 768m
    volumes:
      - ./data/live_capture:/app/data/live_capture
      - ./data/futures/liquidations:/app/data/futures/liquidations
      - ./logs:/app/logs
      - ./deploy/backup/status:/app/backup_status:ro
    command: ["/app/.venv/bin/python", "-m", "src.market_data.streams.normalizer_main"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
