services:
  mhs-live:
    image: ghcr.io/kthyeong/crypto-pilot-live:latest
    container_name: mhs-live-daemon
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      - HARDWARE_MAX_WORKERS=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./docs/results/mhs_horizon_diagnostic_artifacts:/app/docs/results/mhs_horizon_diagnostic_artifacts
    mem_limit: 1200m
    command: ["uv", "run", "python", "-m", "src.cli.main", "live", "daemon"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  liquidation-collector:
    image: ghcr.io/kthyeong/crypto-pilot-live:latest
    container_name: liquidation-collector
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    volumes:
      - ./data/futures/liquidations:/app/data/futures/liquidations
    command: ["uv", "run", "python", "-m", "src.cli.main", "data", "collect", "stream-liquidations"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
