[project]
name = "quant-trading-system"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "optuna",
    "numba",
    "numpy",
    "pandas",
    "scikit-learn>=1.3.0",
    "gplearn>=0.4.2",
    "hmmlearn>=0.3.2",
    "lightgbm>=4.3.0",
    "statsmodels>=0.14.0",
    "pyarrow",
]

[project.optional-dependencies]
nsga2 = ["deap>=1.4"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git"
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", # PEP8, Pyflakes, Import, Naming
    "B",    # Bugbear
    "S",    # Bandit
    "PERF", # Perflint
    "RUF",  # Ruff-specific
    "UP",   # pyupgrade
    "D",    # pydocstyle
    "TID",  # flake8-tidy-imports
    "ASYNC" # flake8-async
]
ignore = [
    "D100", "D104", "D103", # Missing docstrings (AI efficiency)
    "S101",                 # Allow assert
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402", "N806"]
"src/domain/futures/ml_pipeline/**/*.py" = ["N803", "N806"]
"src/domain/futures/engine_multi_futures.py" = ["E501", "E701", "E702"]

[tool.mypy]
# AI에게 엄격한 Type Hinting 강제
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git"
]

[tool.pyright]
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"