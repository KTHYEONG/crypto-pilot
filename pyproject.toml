[project]
name = "quant-trading-system"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "optuna>=4.1.0",
    "numba>=0.60.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.6.0",
    "gplearn>=0.4.3",
    "lightgbm>=4.5.0",
    "catboost>=1.2.0",
    "statsmodels>=0.14.0",
    "pyarrow>=15.0.0",
    "jax[cuda12-pip,cuda13]>=0.10.0",
    "optax>=0.2.8",
    "ccxt>=4.5.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.13.0",
    "TA-Lib>=0.4.32",
    "tenacity>=8.5.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "psutil>=6.0.0",
    "tqdm>=4.67.0",
    "joblib>=1.4.0",
    "redis>=7.4.0",
    "threadpoolctl>=3.6.0",
    "duckdb>=1.5.4",
]

[project.optional-dependencies]
nsga2 = ["deap>=1.4"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git"
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", # PEP8, Pyflakes, Import, Naming
    "B",    # Bugbear
    "S",    # Bandit (Security)
    "PERF", # Perflint (Performance)
    "RUF",  # Ruff-specific
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions (Performance/Readability)
    "PT",   # flake8-pytest-style (Testing)
    "SIM",  # flake8-simplify (Readability)
    "TID",  # flake8-tidy-imports
    "ASYNC" # flake8-async
]
ignore = [
    "S101",   # Allow assert (essential for pytest and invariant checking)
    "E741",   # Allow ambiguous variable names like 'l', 'O', 'I' (often used in math/quant formulas)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402", "N806"]
"src/domain/futures/ml_pipeline/**/*.py" = ["N803", "N806"]
"src/domain/futures/backtest/engine.py" = ["E501"]
"src/domain/futures/optimization/evaluator.py" = ["E501"]
"src/core/exchange/binance_vision.py" = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
# AI에게 엄격한 Type Hinting 강제
strict = true
explicit_package_bases = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git",
    "^tests/.*/conftest\\.py$"
]

[tool.pyright]
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
markers = [
    "integration: Binance API / 외부 네트워크가 필요한 통합 테스트",
]
filterwarnings = [
    "ignore::optuna.exceptions.ExperimentalWarning",
    "ignore:.*restart_strategy.*:FutureWarning:optuna.*",
    "ignore::FutureWarning:optuna.*",
    "ignore::RuntimeWarning:numpy.*",
    "ignore::RuntimeWarning:scipy.*",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
