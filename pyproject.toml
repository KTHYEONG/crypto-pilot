[project]
name = "quant-trading-system"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "optuna>=4.1.0",
    "numba>=0.60.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.6.0",
    "gplearn>=0.4.3",
    "lightgbm>=4.5.0",
    "catboost>=1.2.0",
    "statsmodels>=0.14.0",
    "pyarrow>=15.0.0",
    "jax[cuda12-pip,cuda13]>=0.10.0",
    "optax>=0.2.8",
    "ccxt>=4.5.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.13.0",
    "TA-Lib>=0.4.32",
    "tenacity>=8.5.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "psutil>=6.0.0",
    "tqdm>=4.67.0",
    "joblib>=1.4.0",
]

[project.optional-dependencies]
nsga2 = ["deap>=1.4"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git"
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", # PEP8, Pyflakes, Import, Naming
    "B",    # Bugbear
    "S",    # Bandit
    "PERF", # Perflint
    "RUF",  # Ruff-specific
    "UP",   # pyupgrade
    "D",    # pydocstyle
    "TID",  # flake8-tidy-imports
    "ASYNC" # flake8-async
]
ignore = [
    "D100", "D104", "D103", # Missing docstrings (AI efficiency)
    "S101",                 # Allow assert
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402", "N806"]
"src/domain/futures/ml_pipeline/**/*.py" = ["N803", "N806"]
"src/domain/futures/backtest_engine.py" = ["E501", "E701", "E702"]

[tool.mypy]
# AI에게 엄격한 Type Hinting 강제
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git"
]

[tool.pyright]
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
markers = [
    "integration: Binance API / 외부 네트워크가 필요한 통합 테스트",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "ruff>=0.15.12",
]
