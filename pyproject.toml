[project]
name = "quant-trading-system"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "optuna",
    "numba",
    "numpy",
    "pandas",
    "scikit-learn>=1.3.0",
    "gplearn>=0.4.2",
    "hmmlearn>=0.3.2",
    "lightgbm>=4.3.0",
    "statsmodels>=0.14.0",
    "pyarrow",
]

[project.optional-dependencies]
nsga2 = ["deap>=1.4"]

[tool.ruff]
line-length = 100
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git"
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", # PEP8, Pyflakes, Import 정렬, Naming 컨벤션
    "B",    # Bugbear: 잠재적 버그 탐지
    "S",    # Bandit: 보안 취약점 진단
    "PERF", # Perflint: 성능 최적화 안티패턴 탐지
    "RUF"   # Ruff: 고유 정적 분석 규칙
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402", "N806"]
"src/domain/futures/ml_pipeline/**/*.py" = ["N803", "N806"]

[tool.ruff.format]
# 필요한 경우 포맷팅 설정을 추가할 수 있습니다.

[tool.mypy]
# AI에게 엄격한 Type Hinting 강제
strict = true
ignore_missing_imports = true
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git"
]

[tool.pyright]
# 기존 Pyright 설정 유지
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git"
]

[tool.isort]
# 기존 설정 유지 (단, Ruff의 'I' 옵션이 Import를 처리하므로 보조 수단으로 사용)
skip = [
    "data", 
    "legacy", 
    "logs", 
    "results"
]
profile = "black"